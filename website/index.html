<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Peminjaman - CAR KEY</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ==========================================
     SIDEBAR
========================================== -->

<aside class="sidebar">

    <!-- BRAND -->
    <div class="brand">

        <div class="brand-icon">

            <img
                src="assets/logo.png"
                alt="Smart Vehicle Key System"
            >

        </div>


        <div>

            <h2>CAR KEY</h2>

            <span>
                Management System
            </span>

        </div>

    </div>


    <!-- MENU -->
    <nav class="sidebar-menu">


        <!-- PEMINJAMAN -->
        <a
            href="index.html"
            class="menu-item active"
        >

            <span class="menu-icon">
                🔑
            </span>

            <span>
                Peminjaman
            </span>

        </a>


        <!-- DASHBOARD -->
        <a
            href="dashboard.html"
            class="menu-item"
        >

            <span class="menu-icon">
                📊
            </span>

            <span>
                Dashboard
            </span>

        </a>


        <!-- PENGEMBALIAN -->
        <a
            href="pengembalian.html"
            class="menu-item"
        >

            <span class="menu-icon">
                ↩️
            </span>

            <span>
                Pengembalian
            </span>

        </a>


        <!-- LOG AKTIVITAS -->
        <a
            href="logs.html"
            class="menu-item"
        >

            <span class="menu-icon">
                📋
            </span>

            <span>
                Log Aktivitas
            </span>

        </a>


    </nav>


    <!-- SYSTEM STATUS -->
    <div class="sidebar-status">

        <div class="status-indicator"></div>

        <div>

            <strong>
                Sistem Online
            </strong>

            <small>
                ESP32 Ready
            </small>

        </div>

    </div>


</aside>



<!-- ==========================================
     MAIN CONTENT
========================================== -->

<main class="main-content">


    <!-- TOPBAR -->

    <header class="topbar">

        <div>

            <div class="system-label">
                SMART VEHICLE KEY SYSTEM
            </div>

            <h1>
                Peminjaman
            </h1>

            <p>
                Sistem peminjaman kunci kendaraan
            </p>

        </div>


        <div class="system-online">

            <span></span>

            System Online

        </div>

    </header>



    <!-- CONTENT -->

    <section class="content">


        <div class="card">


            <div class="card-header">

                <div>

                    <span class="section-label">
                        PEMINJAMAN KUNCI
                    </span>

                    <h2>
                        Form Peminjaman
                    </h2>

                    <p>
                        Silakan masukkan nama peminjam
                        dan PIN akses.
                    </p>

                </div>

            </div>



            <!-- FORM -->

            <form id="loanForm">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="borrowerName">
                        Nama Peminjam
                    </label>

                    <input
                        type="text"
                        id="borrowerName"
                        placeholder="Masukkan nama peminjam"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- PIN -->

                <div class="form-group">

                    <label for="pin">
                        PIN Akses
                    </label>

                    <input
                        type="password"
                        id="pin"
                        maxlength="6"
                        inputmode="numeric"
                        placeholder="Masukkan 6 digit PIN"
                        autocomplete="off"
                        required
                    >

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn-primary"
                >

                    🔑

                    MULAI PEMINJAMAN

                </button>


            </form>


        </div>


    </section>


</main>



<!-- JAVASCRIPT -->

<script src="config.js"></script>

<script src="app.js"></script>


</body>

</html>
